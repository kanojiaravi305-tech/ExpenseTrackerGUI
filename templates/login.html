<!-- ============================================================
     Login Page Template (login.html)
     Allows users to input their credentials to log in.
     ============================================================ -->
{% extends "base.html" %}

{% block title %}Log In - Expense Tracker{% endblock %}

{% block content %}

    <!-- Centered Container for Login Card -->
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h3>Log In to Expense Tracker</h3>
            
            <form action="{{ url_for('login') }}" method="POST" id="loginForm">
                
                <!-- Username Input -->
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" 
                           placeholder="Enter your username" required autocomplete="username">
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" 
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <!-- Submit Button -->
                <div class="form-buttons">
                    <button type="submit" class="btn btn-blue" style="width: 100%;">Log In</button>
                </div>
            </form>

            <!-- Link to Registration Page -->
            <p class="auth-redirect">
                Don't have an account? <a href="{{ url_for('signup') }}">Sign Up here</a>.
            </p>
        </div>
    </div>

{% endblock %}
